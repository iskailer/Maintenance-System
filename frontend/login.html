<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - Sistema de Manutenção</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="bg-light">
        <div class="container" style="max-width: 420px;">
            <h1 class="h4 text-center my-4">Sistema de Controle de Manutenção</h1>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100"> Entrar</button>
                <button type="button" id="registerButton"
                class="btn btn-outline-secondary w-100 mt-2">Criar conta</button> 
                <button type="button" id="resetPasswordButton" 
                class="btn btn-link"> Esqueci minha senha</button>
                <p id="feedback" role="status" aria-live="polite"></p>
            </form>
        </div>
        <script type="module" src="./js/login.js"></script>
    </body>
</html>
