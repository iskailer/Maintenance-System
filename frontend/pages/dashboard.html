<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard - Sistema de Manutenção</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/dashboard.css">
        <link rel="stylesheet" href="../css/forms.css">
    </head>
    <body class="bg-light">
        <div class="container-fluid">
            <div class="row">
                <aside class="col-md-3 col-lg-2 bg-dark text-white min-vh-100">
                    <h4 class="mb-4">Manutenção</h4>
                    <p id="userInfo"></p>
                    <nav class="nav flex-column">
                        <a class="nav-link text-white active" href="#">Dashboard</a>
                        <a class="nav-link text-white" href="#">Equipamentos</a>
                        <a class="nav-link text-white" href="#">Categorias</a>
                        <a class="nav-link text-white" href="#">Tecnicos</a>
                        <button id="logoutButton" class="btn btn-outline-danger">Sair</button>
                    </nav>
                </aside>
                <main class="col-md-9 col-lg-10 p-4">
                    <div id="pageAlert" class="alert alert-danger d-none" role="alert"></div>
                    <form id="searchForm" class="row g-3 mb-4">
                        <div class="col-md-8">
                            <input id="searchInput" type="text" class="form-control" placeholder="Pesquisar Equipamento...">
                        </div>
                        <div class="col-md-4">
                            <button type="submit" class="btn btn-primary w-100">
                                Pesquisar
                            </button>
                        </div>
                    </form>
                    
                    <div class="row g-4 mb-4">
                        <div class="col-md-4">
                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h6>Equipamentos Ativos</h6>
                                    <h2 id="activesTotal">3</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h6>Manutenção Preventiva</h6>
                                    <h2 id="preventiveTotal">3</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h6>Em Manutenção</h6>
                                    <h2 id="maintenanceEquipmentsTotal">3</h2>
                                </div>
                            </div>
                        </div>
                        
                    </div>
                    <div class="row">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Equipamento</th>
                                    <th>Patrimônio</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="equipmentsTable">
                            </tbody>
                        </table>
                    </div>
                    <div class="row">
                        <button id="btnNewEquipment"
                        class="btn btn-primary"
                        >Novo Equipamento</button>
                    </div>
                </main>

                <div class="modal fade"
                id="equipmentModal"
                tabindex="-1"
                aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">
                                    Novo Equipamento
                                </h5>
                                <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <input 
                                type="text"
                                id="equipmentName"
                                class="form-control"
                                placeholder="Nome do Equipamento"
                                >
                                <input 
                                type="text"
                                id="equipmentPatrimony"
                                class="form-control mt-2"
                                placeholder="Patrimônio"
                                >
                                <button type="button"
                                id="btnSaveEquipment"
                                class="btn btn-success"
                                >Salvar</button>

                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <footer>
            <p>2026 Sistema de Controle e Manutenção de Equipamentos ADS2026-2</p>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script type="module" src="../js/dashboard.js"></script>
    </body>
</html>
